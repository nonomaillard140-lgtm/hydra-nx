name: apply-variantes
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: appliquer
        run: |
          git checkout -b variantes
          cat > internal/fuzz/variants_ext.go <<'GOEOF'
          package fuzz

          import "strings"

          var highValue = []string{
          	"/.env", "/.env.local", "/.env.prod", "/.env.production", "/.env.bak",
          	"/wp-config.php", "/wp-config.php.bak", "/.git/config", "/.git/HEAD",
          	"/config.php.bak", "/docker-compose.yml", "/.aws/credentials",
          	"/.htpasswd", "/.svn/entries", "/backup.sql", "/app.js.map", "/main.js.map",
          }

          func IsHighValue(p string) bool {
          	for _, s := range highValue {
          		if strings.HasSuffix(p, s) {
          			return true
          		}
          	}
          	return false
          }

          func pct(s, hex string) string {
          	var b strings.Builder
          	for i := 0; i < len(s); i++ {
          		c := s[i]
          		if c == '/' || c == '.' {
          			b.WriteByte('%')
          			b.WriteByte(hex[c>>4])
          			b.WriteByte(hex[c&0x0f])
          			continue
          		}
          		b.WriteByte(c)
          	}
          	return b.String()
          }

          func VariantsExtended(raw string) []string {
          	if !strings.HasPrefix(raw, "/") {
          		raw = "/" + raw
          	}
          	out := []string{raw}
          	if !IsHighValue(raw) {
          		return out
          	}
          	seen := map[string]bool{raw: true}
          	add := func(p string) {
          		if seen[p] {
          			return
          		}
          		seen[p] = true
          		out = append(out, p)
          	}
          	low := pct(raw, "0123456789abcdef")
          	add(low)
          	add(strings.ReplaceAll(low, "%", "%25"))
          	add(pct(raw, "0123456789ABCDEF"))
          	add(raw + "/")
          	add("/./" + strings.TrimPrefix(raw, "/"))
          	if i := strings.LastIndex(raw, "."); i > strings.LastIndex(raw, "/") {
          		add(raw[:i] + "%00" + raw[i:])
          	}
          	return out
          }
          GOEOF
          python3 - <<'PYEOF'
          import pathlib, sys
          p = pathlib.Path("internal/scan/scanner.go")
          s = p.read_text(encoding="utf-8")
          a = '\tcopy := *base\n\tcopy.Path = variant\n\tcopy.RawPath = ""'
          b = '\t\tvariants = fuzz.VariantPaths(pathConfig.Raw)\n\t}'
          if a not in s or b not in s:
              sys.exit("ancre absente")
          s = s.replace(a, '\traw, query, _ := strings.Cut(variant, "?")\n\tdecoded, err := url.PathUnescape(raw)\n\tif err != nil {\n\t\treturn "", err\n\t}\n\tcopy := *base\n\tcopy.Path = decoded\n\tcopy.RawPath = raw\n\tcopy.RawQuery = query', 1)
          s = s.replace(b, '\t\tvariants = fuzz.VariantPaths(pathConfig.Raw)\n\t\tif s.store.StringSetting(ctx, "variants_extended", "false") == "true" {\n\t\t\tvariants = fuzz.VariantsExtended(pathConfig.Raw)\n\t\t}\n\t}', 1)
          p.write_text(s, encoding="utf-8")
          print("scanner patché")
          PYEOF
          gofmt -w internal/
          git config user.name "hydra-bot"
          git config user.email "hydra-bot@users.noreply.github.com"
          git add -A
          git commit -m "variantes de chemin opt-in"
          git push origin variantes
      - name: frontend
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...
