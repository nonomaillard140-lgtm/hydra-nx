name: cleanup
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: suppression des workflows temporaires
        run: |
          git config user.name "hydra-bot"
          git config user.email "hydra-bot@users.noreply.github.com"
          for f in \
            add-variants-test apply-variantes apply-variants-2 diag-merge diag-tests \
            fix-tests-2 fix-tests fix-variants m1-a-fix m1-a-smtp-control m1-b-hit-send \
            m1-c-mx-port m1c-diag merge-variantes send-from-hit settings-toggle cleanup; do
            if [ -f ".github/workflows/$f.yml" ]; then
              git rm -q ".github/workflows/$f.yml"
              echo "supprime: $f.yml"
            fi
          done
          git commit -m "nettoyage: workflows de chantier, seul ci.yml reste"
          git push origin HEAD:main
      - name: suppression des branches mortes
        run: |
          for b in m1c diag variantes validation nonomaillard140-lgtm-patch-1; do
            if git ls-remote --exit-code --heads origin "$b" >/dev/null 2>&1; then
              git push origin --delete "$b" && echo "branche supprimee: $b"
            else
              echo "branche absente: $b"
            fi
          done
