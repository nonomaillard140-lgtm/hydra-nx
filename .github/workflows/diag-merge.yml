name: diag-merge
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: tentative de fusion
        continue-on-error: true
        run: |
          {
            echo "=== fetch ==="
            git fetch origin variantes 2>&1
            echo "=== merge ==="
            git merge --no-ff origin/variantes -m "fusion variantes" 2>&1
            echo "=== conflits ==="
            git diff --name-only --diff-filter=U 2>&1
            echo "=== statut ==="
            git status --short 2>&1
            echo "=== historique variantes ==="
            git log --oneline -5 origin/variantes 2>&1
          } > /tmp/merge.txt
          cat /tmp/merge.txt
      - name: publication du rapport
        if: always()
        run: |
          cp /tmp/merge.txt diag-merge.txt
          git config user.name "hydra-bot"
          git config user.email "hydra-bot@users.noreply.github.com"
          git checkout -B diag
          git add -f diag-merge.txt
          git commit -m "rapport de fusion"
          git push -f origin HEAD:diag
