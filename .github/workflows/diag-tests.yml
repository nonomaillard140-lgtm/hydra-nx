name: diag-tests
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: frontend
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: tests
        continue-on-error: true
        run: |
          go test ./... -count=1 > /tmp/report.txt 2>&1 || true
          cat /tmp/report.txt
      - name: publication du rapport
        if: always()
        run: |
          cp /tmp/report.txt diag-report.txt
          git config user.name "hydra-bot"
          git config user.email "hydra-bot@users.noreply.github.com"
          git checkout -B diag
          git add -f diag-report.txt
          git commit -m "rapport de tests"
          git push -f origin HEAD:diag
