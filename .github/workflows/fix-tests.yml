name: fix-tests
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: variantes
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: corriger les tests
        run: |
          cat > internal/addons/registry_test.go <<'GOEOF'
          package addons

          import (
          	"context"
          	"strings"
          	"testing"
          )

          func TestOfflineValidation(t *testing.T) {
          	registry := NewRegistry()
          	if len(registry.List()) < 20 {
          		t.Fatal("registre incomplet")
          	}
          	result := registry.Validate(context.Background(), Evidence{
          		Service:  "stripe",
          		Redacted: "STRIPE_KEY=<redacted>",
          		Hash:     "abc",
          		Value:    "sk_live_4TqZ8mKx2LpV9RnB7WcY6HsD",
          	})
          	if result.Status != StatusPlausible || !strings.Contains(result.Action, "Révoquer") || result.Quota != "non interrogé" {
          		t.Fatalf("analyse locale inattendue: %+v", result)
          	}
          	if result.Reason == "" {
          		t.Fatal("motif absent")
          	}
          }

          func TestOfflineValidationEmpty(t *testing.T) {
          	registry := NewRegistry()
          	result := registry.Validate(context.Background(), Evidence{Service: "aws", Hash: "abc"})
          	if result.Status != StatusInvalid {
          		t.Fatalf("valeur absente acceptée: %+v", result)
          	}
          }
          GOEOF
          python3 - <<'PYEOF'
          import pathlib, sys
          p = pathlib.Path("internal/license/license_test.go")
          s = p.read_text(encoding="utf-8")
          old = '''	replacement := "A"
	if strings.HasSuffix(item.Key, "A") {
		replacement = "B"
	}
	tampered := item.Key[:len(item.Key)-1] + replacement
	if _, err := manager.Verify(tampered); err == nil {
		t.Fatal("licence modifiée acceptée")
	}'''
          new = '''	// Le dernier caractère base64 ne porte que 4 bits utiles: on tape au milieu.
	tampered := []byte(item.Key)
	changed := false
	for i := 0; i < len(tampered)/2; i++ {
		c := tampered[i]
		if (c >= 'A' && c <= 'Z') || (c >= 'a' && c <= 'z') || (c >= '0' && c <= '9') {
			if c == 'A' {
				tampered[i] = 'B'
			} else {
				tampered[i] = 'A'
			}
			changed = true
			break
		}
	}
	if !changed {
		t.Fatal("altération impossible")
	}
	if _, err := manager.Verify(string(tampered)); err == nil {
		t.Fatal("licence modifiée acceptée")
	}'''
          if old not in s:
              sys.exit("ancre absente dans license_test.go")
          s = s.replace(old, new, 1)
          s = s.replace('\t"strings"\n', '', 1)
          p.write_text(s, encoding="utf-8")
          print("license_test corrigé")
          PYEOF
          gofmt -w internal/
          git config user.name "hydra-bot"
          git config user.email "hydra-bot@users.noreply.github.com"
          git add -A
          git commit -m "tests: validation locale et altération de licence"
          git push origin variantes
      - name: frontend
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...
