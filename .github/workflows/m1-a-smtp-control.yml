name: m1-a-smtp-control
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  m1a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: migration
        run: |
          cat > internal/store/migrations/0003_smtp_control_transport.sql <<'GOEOF'
          ALTER TABLE sends ADD COLUMN smtp_host TEXT NOT NULL DEFAULT '';
          ALTER TABLE sends ADD COLUMN smtp_port TEXT NOT NULL DEFAULT '';
          ALTER TABLE sends ADD COLUMN smtp_user TEXT NOT NULL DEFAULT '';
          GOEOF
      - name: resolution et classification
        run: |
          cat > internal/send/mx.go <<'GOEOF'
          package send

          import (
          	"context"
          	"errors"
          	"net"
          	"net/mail"
          	"sort"
          	"strings"
          	"time"
          )

          type MXResolver interface {
          	Lookup(ctx context.Context, domain string) ([]string, error)
          }

          type NetMXResolver struct{}

          func (NetMXResolver) Lookup(ctx context.Context, domain string) ([]string, error) {
          	ctx, cancel := context.WithTimeout(ctx, 5*time.Second)
          	defer cancel()
          	records, err := net.DefaultResolver.LookupMX(ctx, domain)
          	if err != nil {
          		return nil, err
          	}
          	sort.SliceStable(records, func(i, j int) bool {
          		if records[i].Pref != records[j].Pref {
          			return records[i].Pref < records[j].Pref
          		}
          		return records[i].Host < records[j].Host
          	})
          	hosts := make([]string, 0, len(records))
          	for _, record := range records {
          		host := strings.TrimSuffix(record.Host, ".")
          		if host != "" {
          			hosts = append(hosts, host)
          		}
          	}
          	return hosts, nil
          }

          type providerHost struct {
          	domains  []string
          	host     string
          	port     int
          	template bool
          }

          var providerHosts = []providerHost{
          	{domains: []string{"ovh.net", "ovh.com", "ovh.fr"}, host: "ssl0.ovh.net", port: 465},
          	{domains: []string{"gmail.com", "googlemail.com"}, host: "smtp.gmail.com", port: 587},
          	{domains: []string{"outlook.com", "hotmail.com", "hotmail.fr", "live.com", "live.fr"}, host: "smtp-mail.outlook.com", port: 587},
          	{domains: []string{"infomaniak.com", "infomaniak.ch"}, host: "mail.infomaniak.com", port: 587},
          	{domains: []string{"ionos.fr", "ionos.com", "1and1.fr", "1and1.com"}, host: "smtp.ionos.fr", port: 587},
          	{domains: []string{"hostinger.com", "hostinger.fr"}, host: "smtp.hostinger.com", port: 465},
          	{domains: []string{"gandi.net"}, host: "mail.gandi.net", port: 587},
          	{domains: []string{"alwaysdata.net", "alwaysdata.com"}, host: "smtp.alwaysdata.com", port: 587},
          	{domains: []string{"o2switch.net", "o2switch.fr"}, template: true, port: 465},
          	{domains: []string{"planethoster.net", "planethoster.com", "planethoster.fr"}, template: true, port: 465},
          }

          func providerFor(domain string) (providerHost, bool) {
          	domain = strings.ToLower(domain)
          	for _, entry := range providerHosts {
          		for _, candidate := range entry.domains {
          			if domain == candidate || strings.HasSuffix(domain, "."+candidate) {
          				return entry, true
          			}
          		}
          	}
          	return providerHost{}, false
          }

          func domainOf(identity string) (string, error) {
          	address, err := mail.ParseAddress(strings.TrimSpace(identity))
          	if err != nil {
          		return "", errors.New("identifiant SMTP invalide")
          	}
          	_, domain, found := strings.Cut(address.Address, "@")
          	if !found || domain == "" {
          		return "", errors.New("identifiant SMTP sans domaine")
          	}
          	return strings.ToLower(domain), nil
          }

          // ResolveHost deduit l'hote et le port: hote fourni, puis MX, puis table de secours, puis convention.
          func ResolveHost(ctx context.Context, resolver MXResolver, username, host string) (string, int, error) {
          	host = strings.TrimSpace(host)
          	if host != "" {
          		if strings.ContainsAny(host, "\r\n /") {
          			return "", 0, errors.New("hote SMTP invalide")
          		}
          		return host, 587, nil
          	}
          	domain, err := domainOf(username)
          	if err != nil {
          		return "", 0, err
          	}
          	if resolver != nil {
          		if hosts, lookupErr := resolver.Lookup(ctx, domain); lookupErr == nil && len(hosts) > 0 {
          			return hosts[0], 587, nil
          		}
          	}
          	if entry, ok := providerFor(domain); ok {
          		if entry.template {
          			return "mail." + domain, entry.port, nil
          		}
          		return entry.host, entry.port, nil
          	}
          	return "smtp." + domain, 587, nil
          }

          type SMTPError struct {
          	Code    string
          	Field   string
          	Kind    string
          	Message string
          	Cause   error
          }

          func (e *SMTPError) Error() string { return e.Message }
          func (e *SMTPError) Unwrap() error { return e.Cause }

          // ClassifySMTPError traduit une erreur d'envoi en code exploitable, sans exposer le mot de passe.
          func ClassifySMTPError(err error) *SMTPError {
          	if err == nil {
          		return nil
          	}
          	var netErr net.Error
          	if errors.As(err, &netErr) && netErr.Timeout() {
          		return &SMTPError{Code: "timeout", Field: "host", Kind: "network", Message: "delai depasse vers le serveur SMTP", Cause: err}
          	}
          	if errors.Is(err, context.DeadlineExceeded) {
          		return &SMTPError{Code: "timeout", Field: "host", Kind: "network", Message: "delai depasse vers le serveur SMTP", Cause: err}
          	}
          	var protocolErr *textproto.Error
          	if errors.As(err, &protocolErr) {
          		switch protocolErr.Code {
          		case 530, 534, 535, 538:
          			return &SMTPError{Code: "auth_refusee", Field: "username", Kind: "configuration", Message: "authentification refusee par le serveur", Cause: err}
          		case 550, 551, 553, 554:
          			return &SMTPError{Code: "relais_refuse", Field: "from", Kind: "configuration", Message: "expediteur ou relais refuse", Cause: err}
          		}
          	}
          	lower := strings.ToLower(err.Error())
          	if strings.Contains(lower, "authentification smtp refusee") {
          		return &SMTPError{Code: "auth_refusee", Field: "username", Kind: "configuration", Message: "authentification refusee par le serveur", Cause: err}
          	}
          	if strings.Contains(lower, "starttls") || strings.Contains(lower, "certificate") || strings.Contains(lower, "tls") {
          		return &SMTPError{Code: "tls_refuse", Field: "port", Kind: "configuration", Message: "chiffrement refuse par le serveur", Cause: err}
          	}
          	return &SMTPError{Code: "hote_injoignable", Field: "host", Kind: "network", Message: "serveur SMTP injoignable", Cause: err}
          }
          GOEOF
      - name: greffon du resolveur
        run: |
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path("internal/send/mx.go")
          s = p.read_text(encoding="utf-8")
          if '"net/textproto"' not in s:
              s = s.replace('\t"net/mail"', '\t"net/mail"\n\t"net/textproto"', 1)
              p.write_text(s, encoding="utf-8")
              print("import textproto ajoute")
          else:
              print("import deja present")
          PYEOF
      - name: manager et validation
        run: |
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path("internal/send/smtp.go")
          s = p.read_text(encoding="utf-8")
          if "resolver MXResolver" in s:
              print("manager deja etendu")
          else:
              old = 'type Manager struct {\n\tstore *store.Store\n}\n\nfunc NewManager(st *store.Store) *Manager { return &Manager{store: st} }'
              assert old in s, "ancre manager absente"
              new = 'type Manager struct {\n\tstore    *store.Store\n\tresolver MXResolver\n}\n\nfunc NewManager(st *store.Store) *Manager {\n\treturn &Manager{store: st, resolver: NetMXResolver{}}\n}\n\nfunc (m *Manager) SetResolver(resolver MXResolver) { m.resolver = resolver }'
              s = s.replace(old, new, 1)
              old_host = '\tif config.Host == "" || strings.ContainsAny(config.Host, "\\r\\n /") {'
              assert old_host in s, "ancre validation absente"
              s = s.replace(old_host, '\tif config.Host != "" && strings.ContainsAny(config.Host, "\\r\\n /") {', 1)
              p.write_text(s, encoding="utf-8")
              print("manager et validation adaptes")
          PYEOF
      - name: resolution dans l'envoi de controle
        run: |
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path("internal/send/smtp.go")
          s = p.read_text(encoding="utf-8")
          if "ResolveHost(ctx, m.resolver" in s:
              print("envoi deja branche")
          else:
              old = '\trecord := store.Send{UserID: userID, Transport: "smtp", From: config.From, To: config.ControlAddress, Subject: subject}\n\tif err := sendSMTP(ctx, config, subject, body); err != nil {\n\t\trecord.Status, record.Error = "failed", err.Error()\n\t\t_ = m.store.RecordSend(ctx, record)\n\t\treturn err\n\t}\n\trecord.Status = "sent"\n\treturn m.store.RecordSend(ctx, record)'
              assert old in s, "ancre envoi absente"
              new = '\thost, port, err := ResolveHost(ctx, m.resolver, config.Username, config.Host)\n\tif err != nil {\n\t\treturn &SMTPError{Code: "hote_injoignable", Field: "host", Kind: "configuration", Message: err.Error(), Cause: err}\n\t}\n\tif config.Port != 0 {\n\t\tport = config.Port\n\t}\n\tattempt := config\n\tattempt.Host, attempt.Port = host, port\n\trecord := store.Send{UserID: userID, Transport: "smtp", From: attempt.From, To: attempt.ControlAddress, Subject: subject, SMTPHost: host, SMTPPort: strconv.Itoa(port), SMTPUser: attempt.Username}\n\tif err := sendSMTP(ctx, attempt, subject, body); err != nil {\n\t\tclassified := ClassifySMTPError(err)\n\t\trecord.Status, record.Error = "failed", classified.Code+": "+classified.Message\n\t\t_ = m.store.RecordSend(ctx, record)\n\t\treturn classified\n\t}\n\trecord.Status = "sent"\n\treturn m.store.RecordSend(ctx, record)'
              s = s.replace(old, new, 1)
              p.write_text(s, encoding="utf-8")
              print("envoi de controle branche")
          PYEOF
      - name: modele et persistance
        run: |
          python3 - <<'PYEOF'
          import pathlib
          m = pathlib.Path("internal/store/models.go")
          s = m.read_text(encoding="utf-8")
          if "SMTPHost" in s:
              print("modele deja etendu")
          else:
              old = '\tHitID     int64     `json:"hit_id"`'
              assert old in s, "ancre modele absente"
              s = s.replace(old, old + '\n\tSMTPHost  string    `json:"smtp_host"`\n\tSMTPPort  string    `json:"smtp_port"`\n\tSMTPUser  string    `json:"smtp_user"`', 1)
              m.write_text(s, encoding="utf-8")
              print("modele etendu")
          q = pathlib.Path("internal/store/queries_hits.go")
          t = q.read_text(encoding="utf-8")
          if "smtp_host" in t:
              print("persistance deja etendue")
          else:
              pairs = [
                ('from_addr,to_addr,subject,status,error) VALUES(NULLIF(?,0),?,?,?,?,?,?,?)',
                 'from_addr,to_addr,subject,status,error,smtp_host,smtp_port,smtp_user) VALUES(NULLIF(?,0),?,?,?,?,?,?,?,?,?,?)'),
                ('send.Subject, send.Status, send.Error)', 'send.Subject, send.Status, send.Error, send.SMTPHost, send.SMTPPort, send.SMTPUser)'),
                ('SELECT id,hit_id,user_id,transport,from_addr,to_addr,subject,status,error,sent_at',
                 'SELECT id,hit_id,user_id,transport,from_addr,to_addr,subject,status,error,smtp_host,smtp_port,smtp_user,sent_at'),
                ('&item.Error, &item.SentAt', '&item.Error, &item.SMTPHost, &item.SMTPPort, &item.SMTPUser, &item.SentAt'),
              ]
              for old, new in pairs:
                  assert old in t, "ancre persistance absente: " + old[:40]
                  t = t.replace(old, new, 1)
              q.write_text(t, encoding="utf-8")
              print("persistance etendue")
          PYEOF
      - name: handler classifie
        run: |
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path("internal/api/handlers_send.go")
          s = p.read_text(encoding="utf-8")
          if "SMTPError" in s:
              print("handler deja classifie")
          else:
              old = '\tif err := s.sender.SendControl(r.Context(), currentUser(r.Context()).ID, request.Subject, request.Body); err != nil {\n\t\twriteError(w, http.StatusBadGateway, cleanMessage(err))\n\t\treturn\n\t}'
              assert old in s, "ancre handler absente"
              new = '\tif err := s.sender.SendControl(r.Context(), currentUser(r.Context()).ID, request.Subject, request.Body); err != nil {\n\t\tvar classified *send.SMTPError\n\t\tif errors.As(err, &classified) {\n\t\t\tstatus := http.StatusBadGateway\n\t\t\tif classified.Kind == "configuration" {\n\t\t\t\tstatus = http.StatusUnprocessableEntity\n\t\t\t}\n\t\t\twriteJSON(w, status, map[string]string{"error": classified.Message, "code": classified.Code, "field": classified.Field})\n\t\t\treturn\n\t\t}\n\t\twriteError(w, http.StatusBadGateway, cleanMessage(err))\n\t\treturn\n\t}'
              s = s.replace(old, new, 1)
              s = s.replace('import (\n\t"net/http"', 'import (\n\t"errors"\n\t"net/http"', 1)
              p.write_text(s, encoding="utf-8")
              print("handler classifie")
          PYEOF
      - name: interface
        run: |
          python3 - <<'PYEOF'
          import pathlib
          t = pathlib.Path("web/src/types.ts")
          s = t.read_text(encoding="utf-8")
          if "smtp_host" in s:
              print("types deja etendus")
          else:
              old = "export type SendItem = { id: number; hit_id: number; from_addr: string; to_addr: string; subject: string; status: string; error: string; sent_at: string };"
              assert old in s, "ancre type absente"
              t.write_text(s.replace(old, "export type SendItem = { id: number; hit_id: number; from_addr: string; to_addr: string; subject: string; status: string; error: string; smtp_host: string; smtp_port: string; smtp_user: string; sent_at: string };", 1), encoding="utf-8")
              print("types etendus")
          p = pathlib.Path("web/src/Settings.tsx")
          u = p.read_text(encoding="utf-8")
          if "smtp_host ||" in u:
              print("page deja adaptee")
          else:
              pairs = [
                ('<Field label="Hôte SMTP"><input name="host" required placeholder="smtp.example.com" /></Field>',
                 '<Field label="Hôte SMTP" hint="vide = résolution MX du domaine de l\'utilisateur"><input name="host" placeholder="smtp.example.com" /></Field>'),
                ("['De', 'Vers', 'Sujet', 'Statut', 'Erreur', 'Date']", "['De', 'Vers', 'Sujet', 'Hôte', 'Port', 'Utilisateur', 'Statut', 'Erreur', 'Date']"),
                ('<td>{item.subject}</td><td><span', '<td>{item.subject}</td><td className="mono">{item.smtp_host || \'—\'}</td><td>{item.smtp_port || \'—\'}</td><td className="mono">{item.smtp_user || \'—\'}</td><td><span'),
              ]
              for old, new in pairs:
                  assert old in u, "ancre interface absente: " + old[:40]
                  u = u.replace(old, new, 1)
              p.write_text(u, encoding="utf-8")
              print("page adaptee")
          PYEOF
      - name: tests
        run: |
          cat > internal/send/mx_test.go <<'GOEOF'
          package send_test

          import (
          	"context"
          	"errors"
          	"net"
          	"net/textproto"
          	"testing"

          	"hydra/internal/auth"
          	"hydra/internal/send"
          	"hydra/internal/store"
          )

          type fakeResolver struct {
          	hosts  []string
          	err    error
          	calls  int
          	domain string
          }

          func (f *fakeResolver) Lookup(_ context.Context, domain string) ([]string, error) {
          	f.calls++
          	f.domain = domain
          	return f.hosts, f.err
          }

          func TestResolveHostUsesFirstMX(t *testing.T) {
          	resolver := &fakeResolver{hosts: []string{"mx1.exemple.tld.", "mx2.exemple.tld."}}
          	host, port, err := send.ResolveHost(context.Background(), resolver, "bob@exemple.tld", "")
          	if err != nil {
          		t.Fatal(err)
          	}
          	if host != "mx1.exemple.tld" || port != 587 || resolver.calls != 1 || resolver.domain != "exemple.tld" {
          		t.Fatalf("resolution inattendue: %s %d %+v", host, port, resolver)
          	}
          }

          func TestResolveHostFallsBackToProvider(t *testing.T) {
          	resolver := &fakeResolver{err: errors.New("pas de mx")}
          	host, port, err := send.ResolveHost(context.Background(), resolver, "bob@ovh.net", "")
          	if err != nil {
          		t.Fatal(err)
          	}
          	if host != "ssl0.ovh.net" || port != 465 {
          		t.Fatalf("table de secours inattendue: %s %d", host, port)
          	}
          }

          func TestResolveHostProviderTemplate(t *testing.T) {
          	resolver := &fakeResolver{err: errors.New("pas de mx")}
          	host, port, err := send.ResolveHost(context.Background(), resolver, "bob@o2switch.net", "")
          	if err != nil {
          		t.Fatal(err)
          	}
          	if host != "mail.o2switch.net" || port != 465 {
          		t.Fatalf("gabarit inattendu: %s %d", host, port)
          	}
          }

          func TestResolveHostConvention(t *testing.T) {
          	resolver := &fakeResolver{err: errors.New("pas de mx")}
          	host, port, err := send.ResolveHost(context.Background(), resolver, "bob@inconnu.tld", "")
          	if err != nil {
          		t.Fatal(err)
          	}
          	if host != "smtp.inconnu.tld" || port != 587 {
          		t.Fatalf("convention inattendue: %s %d", host, port)
          	}
          }

          func TestResolveHostDomainBoundary(t *testing.T) {
          	resolver := &fakeResolver{err: errors.New("pas de mx")}
          	host, _, err := send.ResolveHost(context.Background(), resolver, "bob@notgmail.com", "")
          	if err != nil {
          		t.Fatal(err)
          	}
          	if host != "smtp.notgmail.com" {
          		t.Fatalf("collision de suffixe: %s", host)
          	}
          }

          func TestResolveHostExplicitHostSkipsResolver(t *testing.T) {
          	resolver := &fakeResolver{hosts: []string{"mx.exemple.tld"}}
          	host, port, err := send.ResolveHost(context.Background(), resolver, "bob@exemple.tld", "mail.exemple.tld")
          	if err != nil {
          		t.Fatal(err)
          	}
          	if host != "mail.exemple.tld" || port != 587 || resolver.calls != 0 {
          		t.Fatalf("surcharge ignoree: %s %d %d", host, port, resolver.calls)
          	}
          }

          func TestResolveHostRejectsIdentityWithoutDomain(t *testing.T) {
          	if _, _, err := send.ResolveHost(context.Background(), &fakeResolver{}, "bob", ""); err == nil {
          		t.Fatal("identifiant sans domaine accepte")
          	}
          }

          func TestClassifySMTPError(t *testing.T) {
          	cases := []struct {
          		err   error
          		code  string
          		field string
          		kind  string
          	}{
          		{&textproto.Error{Code: 535, Msg: "auth"}, "auth_refusee", "username", "configuration"},
          		{&textproto.Error{Code: 550, Msg: "relay"}, "relais_refuse", "from", "configuration"},
          		{&net.OpError{Op: "dial", Net: "tcp", Err: errors.New("connexion refusee")}, "hote_injoignable", "host", "network"},
          		{&net.DNSError{Err: "i/o timeout", Name: "x.tld", IsTimeout: true}, "timeout", "host", "network"},
          		{errors.New("STARTTLS absent avant AUTH"), "tls_refuse", "port", "configuration"},
          	}
          	for _, item := range cases {
          		classified := send.ClassifySMTPError(item.err)
          		if classified == nil || classified.Code != item.code || classified.Field != item.field || classified.Kind != item.kind {
          			t.Fatalf("classification inattendue pour %v: %+v", item.err, classified)
          		}
          		if !errors.Is(classified, item.err) {
          			t.Fatalf("cause perdue pour %v", item.err)
          		}
          	}
          	if send.ClassifySMTPError(nil) != nil {
          		t.Fatal("erreur nulle mal classee")
          	}
          }

          func TestRecordSendKeepsTransport(t *testing.T) {
          	ctx := context.Background()
          	st, err := store.Open(ctx, t.TempDir())
          	if err != nil {
          		t.Fatal(err)
          	}
          	defer st.Close()
          	if err := st.Migrate(ctx); err != nil {
          		t.Fatal(err)
          	}
          	hash, _ := auth.HashPassword("journal-passphrase")
          	user, err := st.CreateUser(ctx, "journal@example.com", "journal", hash, "user")
          	if err != nil {
          		t.Fatal(err)
          	}
          	record := store.Send{UserID: user.ID, Transport: "smtp", From: "a@exemple.tld", To: "b@exemple.tld", Subject: "s", Status: "failed", Error: "timeout: delai depasse", SMTPHost: "smtp.exemple.tld", SMTPPort: "587", SMTPUser: "a@exemple.tld"}
          	if err := st.RecordSend(ctx, record); err != nil {
          		t.Fatal(err)
          	}
          	items, err := st.Sends(ctx, user.ID)
          	if err != nil || len(items) != 1 {
          		t.Fatalf("journal inattendu: %+v %v", items, err)
          	}
          	if items[0].SMTPHost != "smtp.exemple.tld" || items[0].SMTPPort != "587" || items[0].SMTPUser != "a@exemple.tld" {
          		t.Fatalf("transport non journalise: %+v", items[0])
          	}
          }
          GOEOF
      - name: controles
        run: |
          gofmt -w internal/
          grep -q 'ResolveHost' internal/send/mx.go
          grep -q 'ClassifySMTPError' internal/send/smtp.go
          grep -q 'SMTPError' internal/api/handlers_send.go
          grep -q 'smtp_host' internal/store/queries_hits.go
          grep -q 'smtp_host' web/src/types.ts
          if git diff --name-only | grep -q 'internal/send/hit.go'; then echo "hit.go modifie"; exit 1; fi
          if git diff --name-only | grep -q 'internal/scan/'; then echo "scan modifie"; exit 1; fi
      - name: frontend
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: suite complete avant push
        run: |
          go vet ./...
          go build ./...
          go test ./... -count=1
      - name: commit et push
        run: |
          git config user.name "hydra-bot"
          git config user.email "hydra-bot@users.noreply.github.com"
          git add -A
          git commit -m "transport de controle: resolution MX, table de secours et classification"
          git push origin HEAD:main
