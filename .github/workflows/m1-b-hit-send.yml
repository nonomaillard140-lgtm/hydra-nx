name: m1-b-hit-send
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  m1b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: derivation avec resolveur
        run: |
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path("internal/send/hit.go")
          s = p.read_text(encoding="utf-8")
          if "ResolveHost(ctx, resolver, username" in s:
              print("derivation deja branchee")
          else:
              old_sig = '// DeriveTransport deduit l\'hote et l\'utilisateur de la valeur trouvee, la surcharge manuelle gagne.\nfunc DeriveTransport(secret string, request SendRequest) (SMTPConfig, error) {'
              assert old_sig in s, "ancre signature absente"
              s = s.replace(old_sig, '// DeriveTransport deduit l\'hote et l\'utilisateur de la valeur trouvee, la surcharge manuelle gagne.\nfunc DeriveTransport(ctx context.Context, resolver MXResolver, secret string, request SendRequest) (SMTPConfig, error) {', 1)
              old_host = '\tusername := strings.TrimSpace(request.Username)\n\thost := strings.TrimSpace(request.Host)\n\tif username == "" {\n\t\tif address, err := mail.ParseAddress(secret); err == nil {\n\t\t\tusername = address.Address\n\t\t}\n\t}\n\tif host == "" {\n\t\tif _, domain, found := strings.Cut(username, "@"); found && domain != "" {\n\t\t\thost = "smtp." + domain\n\t\t}\n\t}\n\tif host == "" {\n\t\treturn SMTPConfig{}, errors.New("hote SMTP requis")\n\t}\n\tif strings.ContainsAny(host, "\\r\\n /") {\n\t\treturn SMTPConfig{}, errors.New("hote SMTP invalide")\n\t}\n\tif username == "" {\n\t\treturn SMTPConfig{}, errors.New("utilisateur SMTP requis")\n\t}'
              assert old_host in s, "ancre derivation absente"
              new_host = '\tusername := strings.TrimSpace(request.Username)\n\tif username == "" {\n\t\tif address, err := mail.ParseAddress(secret); err == nil {\n\t\t\tusername = address.Address\n\t\t}\n\t}\n\tif username == "" {\n\t\treturn SMTPConfig{}, errors.New("utilisateur SMTP requis")\n\t}\n\thost, port, err := ResolveHost(ctx, resolver, username, request.Host)\n\tif err != nil {\n\t\treturn SMTPConfig{}, err\n\t}'
              s = s.replace(old_host, new_host, 1)
              old_port = '\tport := request.Port\n\tif port == 0 {\n\t\tport = 587\n\t}'
              assert old_port in s, "ancre port absente"
              s = s.replace(old_port, '\tif request.Port != 0 {\n\t\tport = request.Port\n\t}', 1)
              old_imp = '\t"net/mail"\n\t"strings"'
              assert old_imp in s, "ancre import absente"
              s = s.replace(old_imp, '\t"net/mail"\n\t"strconv"\n\t"strings"', 1)
              p.write_text(s, encoding="utf-8")
              print("derivation branchee sur le resolveur")
          PYEOF
      - name: envoi depuis un hit
        run: |
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path("internal/send/hit.go")
          s = p.read_text(encoding="utf-8")
          if "SMTPHost: config.Host" in s:
              print("envoi deja branche")
          else:
              old = '\tconfig, err := DeriveTransport(secret, request)\n\tif err != nil {\n\t\treturn err\n\t}\n\trecord := store.Send{UserID: userID, HitID: hit.ID, Transport: "smtp", From: config.From, To: config.ControlAddress, Subject: strings.TrimSpace(request.Subject)}\n\tif err := sendSMTP(ctx, config, record.Subject, request.Body); err != nil {\n\t\trecord.Status, record.Error = "failed", err.Error()\n\t\t_ = m.store.RecordSend(ctx, record)\n\t\treturn err\n\t}'
              assert old in s, "ancre envoi absente"
              new = '\tconfig, err := DeriveTransport(ctx, m.resolver, secret, request)\n\tif err != nil {\n\t\treturn err\n\t}\n\trecord := store.Send{UserID: userID, HitID: hit.ID, Transport: "smtp", From: config.From, To: config.ControlAddress, Subject: strings.TrimSpace(request.Subject), SMTPHost: config.Host, SMTPPort: strconv.Itoa(config.Port), SMTPUser: config.Username}\n\tif err := sendSMTP(ctx, config, record.Subject, request.Body); err != nil {\n\t\tclassified := ClassifySMTPError(err)\n\t\trecord.Status, record.Error = "failed", classified.Code+": "+classified.Message\n\t\t_ = m.store.RecordSend(ctx, record)\n\t\treturn classified\n\t}'
              s = s.replace(old, new, 1)
              p.write_text(s, encoding="utf-8")
              print("envoi depuis un hit branche et classifie")
          PYEOF
      - name: handler du hit classifie
        run: |
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path("internal/api/handlers_send.go")
          s = p.read_text(encoding="utf-8")
          if "classified.Field" in s and s.count("var classified *send.SMTPError") == 2:
              print("handler deja classifie")
          else:
              old = '\tif err := s.sender.SendHit(r.Context(), user.ID, id, request); err != nil {\n\t\twriteError(w, http.StatusBadGateway, cleanMessage(err))\n\t\treturn\n\t}'
              assert old in s, "ancre handler hit absente"
              new = '\tif err := s.sender.SendHit(r.Context(), user.ID, id, request); err != nil {\n\t\tvar classified *send.SMTPError\n\t\tif errors.As(err, &classified) {\n\t\t\tstatus := http.StatusBadGateway\n\t\t\tif classified.Kind == "configuration" {\n\t\t\t\tstatus = http.StatusUnprocessableEntity\n\t\t\t}\n\t\t\twriteJSON(w, status, map[string]string{"error": classified.Message, "code": classified.Code, "field": classified.Field})\n\t\t\treturn\n\t\t}\n\t\twriteError(w, http.StatusBadGateway, cleanMessage(err))\n\t\treturn\n\t}'
              s = s.replace(old, new, 1)
              p.write_text(s, encoding="utf-8")
              print("handler du hit classifie")
          PYEOF
      - name: tests de derivation
        run: |
          cat > internal/send/hit_test.go <<'GOEOF'
          package send_test

          import (
          	"context"
          	"errors"
          	"testing"

          	"hydra/internal/send"
          )

          func TestDeriveTransportFromFoundIdentity(t *testing.T) {
          	config, err := send.DeriveTransport(context.Background(), nil, "bob@exemple.tld", send.SendRequest{To: "dest@exemple.tld", Subject: "test", Body: "corps"})
          	if err != nil {
          		t.Fatal(err)
          	}
          	if config.Host != "smtp.exemple.tld" || config.Username != "bob@exemple.tld" || config.From != "bob@exemple.tld" || config.Port != 587 {
          		t.Fatalf("derivation inattendue: %+v", config)
          	}
          }

          func TestDeriveTransportManualOverride(t *testing.T) {
          	request := send.SendRequest{To: "dest@exemple.tld", Subject: "test", Body: "corps", Host: "mail.exemple.tld", Port: 465, Username: "bot", From: "bot@exemple.tld"}
          	config, err := send.DeriveTransport(context.Background(), nil, "secret-123", request)
          	if err != nil {
          		t.Fatal(err)
          	}
          	if config.Host != "mail.exemple.tld" || config.Port != 465 || config.Username != "bot" || config.From != "bot@exemple.tld" {
          		t.Fatalf("surcharge ignoree: %+v", config)
          	}
          }

          func TestDeriveTransportNeedsIdentity(t *testing.T) {
          	if _, err := send.DeriveTransport(context.Background(), nil, "secret-123", send.SendRequest{To: "dest@exemple.tld", Subject: "test", Body: "corps"}); err == nil {
          		t.Fatal("hote manquant accepte")
          	}
          }

          func TestDeriveTransportRejectsBadRecipient(t *testing.T) {
          	if _, err := send.DeriveTransport(context.Background(), nil, "bob@exemple.tld", send.SendRequest{To: "dest", Subject: "test", Body: "corps"}); err == nil {
          		t.Fatal("destinataire invalide accepte")
          	}
          }

          func TestDeriveTransportUsesMX(t *testing.T) {
          	resolver := &fakeResolver{hosts: []string{"mx1.exemple.tld.", "mx2.exemple.tld."}}
          	config, err := send.DeriveTransport(context.Background(), resolver, "bob@exemple.tld", send.SendRequest{To: "dest@exemple.tld", Subject: "test", Body: "corps"})
          	if err != nil {
          		t.Fatal(err)
          	}
          	if config.Host != "mx1.exemple.tld" || config.Port != 587 || resolver.calls != 1 || resolver.domain != "exemple.tld" {
          		t.Fatalf("mx non utilise: %+v %+v", config, resolver)
          	}
          }

          func TestDeriveTransportExplicitHostSkipsResolver(t *testing.T) {
          	resolver := &fakeResolver{hosts: []string{"mx.exemple.tld"}}
          	config, err := send.DeriveTransport(context.Background(), resolver, "bob@exemple.tld", send.SendRequest{To: "dest@exemple.tld", Subject: "test", Body: "corps", Host: "mail.exemple.tld"})
          	if err != nil {
          		t.Fatal(err)
          	}
          	if config.Host != "mail.exemple.tld" || resolver.calls != 0 {
          		t.Fatalf("surcharge ignoree: %+v", config)
          	}
          }

          func TestDeriveTransportResolverFailureFallsBackToProvider(t *testing.T) {
          	resolver := &fakeResolver{err: errors.New("pas de mx")}
          	config, err := send.DeriveTransport(context.Background(), resolver, "bob@ovh.net", send.SendRequest{To: "dest@exemple.tld", Subject: "test", Body: "corps"})
          	if err != nil {
          		t.Fatal(err)
          	}
          	if config.Host != "ssl0.ovh.net" || config.Port != 465 {
          		t.Fatalf("table de secours inutilisee: %+v", config)
          	}
          }

          func TestDeriveTransportRejectsHeaderInjection(t *testing.T) {
          	if _, err := send.DeriveTransport(context.Background(), nil, "bob@exemple.tld", send.SendRequest{To: "dest@exemple.tld", Subject: "test", Body: "corps", Host: "mail.exemple.tld\r\nX: 1"}); err == nil {
          		t.Fatal("hote injecte accepte")
          	}
          }
          GOEOF
      - name: controles
        run: |
          gofmt -w internal/
          grep -q 'DeriveTransport(ctx, m.resolver' internal/send/hit.go
          grep -q 'SMTPHost: config.Host' internal/send/hit.go
          grep -q 'ClassifySMTPError' internal/send/hit.go
          if grep -q 'DeriveTransport(secret, request)' internal/send/hit.go; then echo "ancienne signature encore appelee"; exit 1; fi
          if grep -q 's.sender.SendHit' internal/api/handlers_send.go && ! grep -q 'classified.Field' internal/api/handlers_send.go; then echo "handler hit non classifie"; exit 1; fi
      - name: frontend
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: suite complete avant push
        run: |
          go vet ./...
          go build ./...
          go test ./... -count=1
      - name: commit et push
        run: |
          git config user.name "hydra-bot"
          git config user.email "hydra-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "rien a committer"; else git commit -m "envoi depuis un hit: resolution MX, classification des erreurs et transport journalise"; fi
          git push origin HEAD:main
