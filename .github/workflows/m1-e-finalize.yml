name: m1-e-finalize
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: suppression
        run: |
          git config user.name "hydra-bot"
          git config user.email "hydra-bot@users.noreply.github.com"
          git rm -q --ignore-unmatch github/workflows/.github/workflows/m1-d-smtp-erreurs.yml
          git rm -q --ignore-unmatch .github/workflows/m1-d-smtp-erreurs.yml
          git rm -q --ignore-unmatch .github/workflows/m1-e-finalize.yml
          git rm -q --ignore-unmatch nx-go-tmp-umask
          git commit -m "nettoyage: workflow m1-d, copie residuelle et fichier vide"
          git push origin HEAD:main
