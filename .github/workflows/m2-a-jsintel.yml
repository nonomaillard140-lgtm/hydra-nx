name: m2-a-jsintel
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  m2a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: paquet jsintel
        run: |
          mkdir -p internal/jsintel
          cat > internal/jsintel/jsintel.go <<'GOEOF'
          package jsintel

          import (
          	"net/url"
          	"regexp"
          	"sort"
          	"strconv"
          	"strings"
          )

          const MaxScripts = 12

          var (
          	scriptPattern   = regexp.MustCompile(`(?i)<script[^>]+src=["']([^"']+)["']`)
          	mapPattern      = regexp.MustCompile(`(?i)sourcemappingurl=([^\s*]+)`)
          	endpointPattern = regexp.MustCompile("[\"'\x60](/(?:api|v1|v2|graphql|rest|admin|internal|auth)[a-zA-Z0-9_\\-/.]*)[\"'\x60]")
          )

          func absolute(base *url.URL, ref string) (string, bool) {
          	ref = strings.TrimSpace(ref)
          	if ref == "" || strings.HasPrefix(ref, "data:") {
          		return "", false
          	}
          	parsed, err := base.Parse(ref)
          	if err != nil || parsed.Host != base.Host {
          		return "", false
          	}
          	parsed.Fragment = ""
          	return parsed.String(), true
          }

          // Scripts rend les scripts de la page, absolus, sur le meme hote, sans doublon et bornes.
          func Scripts(page []byte, base *url.URL) []string {
          	seen := make(map[string]struct{})
          	out := make([]string, 0, MaxScripts)
          	for _, match := range scriptPattern.FindAllSubmatch(page, 200) {
          		full, ok := absolute(base, string(match[1]))
          		if !ok {
          			continue
          		}
          		if _, duplicate := seen[full]; duplicate {
          			continue
          		}
          		seen[full] = struct{}{}
          		out = append(out, full)
          		if len(out) >= MaxScripts {
          			break
          		}
          	}
          	sort.Strings(out)
          	return out
          }

          // Maps rend les source maps declarees dans un script.
          func Maps(body []byte, base *url.URL) []string {
          	out := make([]string, 0, 4)
          	for _, match := range mapPattern.FindAllSubmatch(body, 8) {
          		if full, ok := absolute(base, string(match[1])); ok {
          			out = append(out, full)
          		}
          	}
          	return out
          }

          // Endpoints rend les chemins d'API reperes dans un bundle.
          func Endpoints(body []byte) []string {
          	seen := make(map[string]struct{})
          	out := make([]string, 0, 32)
          	for _, match := range endpointPattern.FindAllSubmatch(body, 400) {
          		path := string(match[1])
          		if len(path) < 5 || len(path) > 120 {
          			continue
          		}
          		if _, duplicate := seen[path]; duplicate {
          			continue
          		}
          		seen[path] = struct{}{}
          		out = append(out, path)
          		if len(out) >= 50 {
          			break
          		}
          	}
          	sort.Strings(out)
          	return out
          }

          type Library struct {
          	Name       string
          	Version    string
          	Vulnerable bool
          	Note       string
          }

          type rule struct {
          	name    string
          	pattern *regexp.Regexp
          	fixed   string
          	note    string
          }

          var rules = []rule{
          	{"jquery", regexp.MustCompile(`(?i)jquery[/@-]?v?(\d+\.\d+\.\d+)`), "3.5.0", "CVE-2020-11022 et 11023, injection HTML via htmlPrefilter"},
          	{"lodash", regexp.MustCompile(`(?i)lodash[/@-]?v?(\d+\.\d+\.\d+)`), "4.17.21", "CVE-2021-23337, injection de commande via template"},
          	{"bootstrap", regexp.MustCompile(`(?i)bootstrap[/@-]?v?(\d+\.\d+\.\d+)`), "3.4.1", "CVE-2019-8331, XSS dans les tooltips"},
          	{"moment", regexp.MustCompile(`(?i)moment[/@-]?v?(\d+\.\d+\.\d+)`), "2.29.4", "CVE-2022-31129, deni de service par expression"},
          	{"angular", regexp.MustCompile(`(?i)angular[/@-]?v?(1\.\d+\.\d+)`), "1.8.0", "CVE-2020-7676, XSS dans le sanitizer"},
          }

          // Libraries repere les bibliotheques et signale celles sous la version corrigee.
          func Libraries(body []byte) []Library {
          	out := make([]Library, 0, 4)
          	seen := make(map[string]struct{})
          	for _, entry := range rules {
          		for _, match := range entry.pattern.FindAllSubmatch(body, 5) {
          			version := string(match[1])
          			if _, duplicate := seen[entry.name+version]; duplicate {
          				continue
          			}
          			seen[entry.name+version] = struct{}{}
          			out = append(out, Library{Name: entry.name, Version: version, Vulnerable: less(version, entry.fixed), Note: entry.note})
          		}
          	}
          	return out
          }

          func less(a, b string) bool {
          	left := strings.Split(a, ".")
          	right := strings.Split(b, ".")
          	for i := 0; i < len(left) && i < len(right); i++ {
          		x, _ := strconv.Atoi(left[i])
          		y, _ := strconv.Atoi(right[i])
          		if x != y {
          			return x < y
          		}
          	}
          	return len(left) < len(right)
          }
          GOEOF
      - name: tests jsintel
        run: |
          cat > internal/jsintel/jsintel_test.go <<'GOEOF'
          package jsintel_test

          import (
          	"net/url"
          	"testing"

          	"hydra/internal/jsintel"
          )

          func base() *url.URL { return &url.URL{Scheme: "https", Host: "exemple.tld"} }

          func TestScriptsMemeHoteSansDoublon(t *testing.T) {
          	page := []byte(`<script src="/a.js"></script><script src="/a.js"></script><script src="https://cdn.autre.tld/b.js"></script><script src="c.js"></script>`)
          	got := jsintel.Scripts(page, base())
          	if len(got) != 2 || got[0] != "https://exemple.tld/a.js" || got[1] != "https://exemple.tld/c.js" {
          		t.Fatalf("scripts inattendus: %v", got)
          	}
          }

          func TestScriptsBorne(t *testing.T) {
          	page := make([]byte, 0)
          	for i := 0; i < 40; i++ {
          		page = append(page, []byte(`<script src="/s.js"></script>`)...)
          	}
          	if got := jsintel.Scripts(page, base()); len(got) != 1 {
          		t.Fatalf("deduplication cassee: %d", len(got))
          	}
          }

          func TestMaps(t *testing.T) {
          	body := []byte("var a=1;\n//# sourceMappingURL=app.js.map\n")
          	got := jsintel.Maps(body, base())
          	if len(got) != 1 || got[0] != "https://exemple.tld/app.js.map" {
          		t.Fatalf("source map inattendue: %v", got)
          	}
          }

          func TestEndpoints(t *testing.T) {
          	body := []byte(`fetch("/api/v1/users");fetch("/api/v1/users");fetch("/graphql");fetch("/x")`)
          	got := jsintel.Endpoints(body)
          	if len(got) != 2 || got[0] != "/api/v1/users" || got[1] != "/graphql" {
          		t.Fatalf("endpoints inattendus: %v", got)
          	}
          }

          func TestLibrariesVulnerables(t *testing.T) {
          	body := []byte("jquery/3.4.1 lodash/4.17.20 bootstrap/3.3.7 moment/2.29.1")
          	got := jsintel.Libraries(body)
          	if len(got) != 4 {
          		t.Fatalf("bibliotheques manquees: %v", got)
          	}
          	for _, lib := range got {
          		if !lib.Vulnerable {
          			t.Fatalf("version vulnerable non signalee: %+v", lib)
          		}
          	}
          }

          func TestLibrariesCorrigees(t *testing.T) {
          	body := []byte("jquery/3.7.1 lodash/4.17.21 bootstrap/5.3.3 moment/2.30.1")
          	for _, lib := range jsintel.Libraries(body) {
          		if lib.Vulnerable {
          			t.Fatalf("version corrigee signalee: %+v", lib)
          		}
          	}
          }
          GOEOF
      - name: import et champ de statistiques
        run: |
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path("internal/scan/scanner.go")
          s = p.read_text(encoding="utf-8")
          if '"hydra/internal/jsintel"' not in s:
              old = '\t"hydra/internal/fuzz"\n'
              assert old in s, "ancre import absente"
              s = s.replace(old, old + '\t"hydra/internal/jsintel"\n', 1)
              p.write_text(s, encoding="utf-8")
              print("import jsintel ajoute")
          else:
              print("import deja present")
          t = pathlib.Path("internal/scan/scanner.go")
          u = t.read_text(encoding="utf-8")
          if '"endpoints"' not in u:
              old = '\tHits      int `json:"hits"`\n'
              assert old in u, "ancre stats absente"
              u = u.replace(old, old + '\tEndpoints int `json:"endpoints"`\n', 1)
              t.write_text(u, encoding="utf-8")
              print("compteur endpoints ajoute")
          else:
              print("compteur deja present")
          PYEOF
      - name: greffon dans le moteur
        run: |
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path("internal/scan/scanner.go")
          s = p.read_text(encoding="utf-8")
          if "s.jsIntel(ctx, crack, base, target, stats)" in s:
              print("greffon deja pose")
          else:
              old = '\tvariants := pathConfig.Variants\n'
              assert old in s, "ancre scanTarget absente"
              s = s.replace(old, '\ts.jsIntel(ctx, crack, base, target, stats)\n' + old, 1)
              p.write_text(s, encoding="utf-8")
              print("greffon pose")
          PYEOF
      - name: methodes jsintel
        run: |
          if grep -q 'func (s \*Scanner) jsIntel' internal/scan/scanner.go; then
            echo "methodes deja presentes"
          else
            cat >> internal/scan/scanner.go <<'GOEOF'

          func (s *Scanner) jsIntel(ctx context.Context, crack store.Crack, base *url.URL, target string, stats *Stats) {
          	page, err := s.get(ctx, base.String()+"/")
          	if err != nil || page.Status >= 400 {
          		return
          	}
          	for _, script := range jsintel.Scripts(page.Body, base) {
          		if ctx.Err() != nil {
          			return
          		}
          		response, err := s.get(ctx, script)
          		stats.Requests++
          		if err != nil || response.Status != 200 {
          			continue
          		}
          		path := "/"
          		if parsed, err := url.Parse(script); err == nil && parsed.Path != "" {
          			path = parsed.Path
          		}
          		if exposure, ok := extract.Detect(path, response.Body); ok && exposure.Confidence >= 55 {
          			if created, err := s.recordExposure(ctx, crack, target, path, response, exposure); err == nil {
          				stats.Hits += created
          			}
          		}
          		stats.Endpoints += len(jsintel.Endpoints(response.Body))
          		for _, lib := range jsintel.Libraries(response.Body) {
          			if !lib.Vulnerable {
          				continue
          			}
          			if created, err := s.recordLibrary(ctx, crack, target, path, lib); err == nil {
          				stats.Hits += created
          			}
          		}
          		for _, mapping := range jsintel.Maps(response.Body) {
          			mapped, err := s.get(ctx, mapping)
          			stats.Requests++
          			if err != nil || mapped.Status != 200 {
          				continue
          			}
          			if exposure, ok := extract.Detect(mapping, mapped.Body); ok && exposure.Confidence >= 55 {
          				if created, err := s.recordExposure(ctx, crack, target, mapping, mapped, exposure); err == nil {
          					stats.Hits += created
          				}
          			}
          		}
          	}
          }

          func (s *Scanner) recordLibrary(ctx context.Context, crack store.Crack, host, requestPath string, lib jsintel.Library) (int, error) {
          	rating := score.Score("lib-vulnerable", lib.Name, 1)
          	hit, err := s.store.UpsertHit(ctx, store.Hit{CrackID: crack.ID, UserID: crack.UserID, Host: host, Path: requestPath,
          		Vuln: "lib-vulnerable", Service: lib.Name, SecretRedacted: lib.Name + " " + lib.Version,
          		SecretHash: s.store.Fingerprint(lib.Name + "\x00" + lib.Version + "\x00" + host),
          		Status: "detected", Points: rating.Points, CashScore: rating.Priority})
          	if err != nil {
          		return 0, err
          	}
          	if s.OnHit != nil {
          		s.OnHit(hit)
          	}
          	return 1, nil
          }
          GOEOF
          fi
      - name: frontend
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: controles
        run: |
          gofmt -w internal/
          grep -q 'func Scripts' internal/jsintel/jsintel.go
          grep -q 'func (s \*Scanner) jsIntel' internal/scan/scanner.go
          grep -q 'recordLibrary' internal/scan/scanner.go
      - name: suite complete avant push
        run: |
          go vet ./...
          go build ./...
          go test ./... -count=1
      - name: commit et push
        run: |
          git config user.name "hydra-bot"
          git config user.email "hydra-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "rien a committer"; else git commit -m "intel javascript: bundles, source maps, endpoints et bibliotheques vulnerables"; fi
          git push origin HEAD:main
