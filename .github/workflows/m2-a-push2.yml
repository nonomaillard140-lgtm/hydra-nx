name: m2-a-push2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2a
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: identite
        run: |
          git config user.name "hydra-bot"
          git config user.email "hydra-bot@users.noreply.github.com"
      - name: appel corrige et commit
        run: |
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path("internal/scan/scanner.go")
          s = p.read_text(encoding="utf-8")
          if "jsintel.Maps(response.Body, base)" in s:
              print("appel deja corrige")
          else:
              old = "jsintel.Maps(response.Body)"
              assert old in s, "ancre Maps absente"
              s = s.replace(old, "jsintel.Maps(response.Body, base)", 1)
              p.write_text(s, encoding="utf-8")
              print("appel Maps corrige")
          PYEOF
          rm -f suite-report.txt
          git add -A
          if git diff --cached --quiet; then echo "rien a committer"; else git commit -m "intel javascript: appel Maps corrige"; fi
      - name: remise a niveau
        run: |
          git fetch origin main
          git rebase origin/main
          git log --oneline -3
      - name: frontend
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: suite complete avant push
        run: |
          go vet ./...
          go build ./...
          go test ./... -count=1 -timeout 180s
      - name: push
        run: git push origin HEAD:main
