name: m2b-diag
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: branche
        run: |
          git config user.name "hydra-bot"
          git config user.email "bot@securedosc.work"
          git fetch origin m2b
          git checkout -B m2b origin/m2b
      - name: patch
        run: |
          python3 - <<'PY'
          import pathlib

          handlers = pathlib.Path("internal/api/handlers_inventory.go")
          src = handlers.read_text()
          if "handleClearScans" in src:
              print("déjà appliqué")
              raise SystemExit(0)

          src = src.replace('import (\n\t"net/http"\n', 'import (\n\t"errors"\n\t"net/http"\n', 1)

          for name in ("DeleteList", "DeletePath"):
              old = '''	if err := s.store.%s(r.Context(), id, ownerID(currentUser(r.Context()))); err != nil {
          		writeError(w, http.StatusNotFound, cleanMessage(err))
          		return
          	}
          ''' % name
              new = '''	if err := s.store.%s(r.Context(), id, ownerID(currentUser(r.Context()))); err != nil {
          		if errors.Is(err, store.ErrNotFound) {
          			writeError(w, http.StatusNotFound, cleanMessage(err))
          			return
          		}
          		writeError(w, http.StatusInternalServerError, cleanMessage(err))
          		return
          	}
          ''' % name
              assert old in src, name
              src = src.replace(old, new, 1)

          handler = '''func (s *Server) handleClearScans(w http.ResponseWriter, r *http.Request) {
          	user := currentUser(r.Context())
          	deleted, err := s.store.ClearScans(r.Context(), ownerID(user))
          	if err != nil {
          		writeError(w, http.StatusInternalServerError, cleanMessage(err))
          		return
          	}
          	_ = s.store.Audit(r.Context(), user.ID, "scan.purge", "", store.MarshalJSON(map[string]int64{"deleted": deleted}))
          	writeJSON(w, http.StatusOK, map[string]any{"ok": true, "deleted": deleted})
          }

          '''
          anchor = "func (s *Server) handleStartScan("
          assert anchor in src
          src = src.replace(anchor, handler + anchor, 1)
          handlers.write_text(src)

          router = pathlib.Path("internal/api/router.go")
          route = router.read_text()
          line = '\t\tprivate.Get("/api/scans", s.handleScans)\n'
          assert line in route
          route = route.replace(line, line + '\t\tprivate.Delete("/api/scans", s.handleClearScans)\n', 1)
          router.write_text(route)

          ui = pathlib.Path("web/src/Inventory.tsx")
          page = ui.read_text()
          clear = '''  const clear = async () => { if (!confirm("Purger l'historique des scans terminés ? Les expositions rattachées seront supprimées.")) return; await submitForm(() => api('/api/scans', { method: 'DELETE' }), setBusy, notify, 'Historique purgé'); await load(); };
          '''
          anchor = "  const start = async (event:"
          assert anchor in page
          page = page.replace(anchor, clear + anchor, 1)
          old_action = '''action={<button className="secondary" onClick={() => void load()}><RefreshCw size={16} />Actualiser</button>}'''
          new_action = '''action={<div style={{ display: 'flex', gap: 8 }}><button className="secondary" disabled={busy} onClick={() => void clear()}><Trash2 size={16} />Vider l'historique</button><button className="secondary" onClick={() => void load()}><RefreshCw size={16} />Actualiser</button></div>}'''
          assert old_action in page
          page = page.replace(old_action, new_action, 1)
          ui.write_text(page)

          tests = pathlib.Path("internal/api/api_test.go")
          body = tests.read_text()
          body = body.replace('import (\n\t"bytes"\n\t"context"\n', 'import (\n\t"bytes"\n\t"context"\n\t"io"\n', 1)
          body += '''
          func TestClearScansEndpoint(t *testing.T) {
          	ctx := context.Background()
          	st, err := store.Open(ctx, t.TempDir())
          	if err != nil {
          		t.Fatal(err)
          	}
          	defer st.Close()
          	if err := st.Migrate(ctx); err != nil {
          		t.Fatal(err)
          	}
          	hash, _ := auth.HashPassword("admin-passphrase")
          	user, err := st.CreateUser(ctx, "admin@example.com", "admin", hash, "admin")
          	if err != nil {
          		t.Fatal(err)
          	}
          	scheduler := scan.NewScheduler(st, 1, 2, 2)
          	server := httptest.NewServer(api.NewServer(st, auth.NewService(st), scheduler, false).Router())
          	defer server.Close()
          	call := func(method, path, body string, cookie *http.Cookie) *http.Response {
          		var reader io.Reader
          		if body != "" {
          			reader = bytes.NewBufferString(body)
          		}
          		request, _ := http.NewRequest(method, server.URL+path, reader)
          		request.Header.Set("Content-Type", "application/json")
          		request.Header.Set("X-Requested-With", "XMLHttpRequest")
          		request.AddCookie(cookie)
          		response, err := http.DefaultClient.Do(request)
          		if err != nil {
          			t.Fatal(err)
          		}
          		return response
          	}
          	login := call(http.MethodPost, "/api/auth/login", `{"identity":"admin","password":"admin-passphrase","device_fingerprint":"test-device"}`, nil)
          	if login.StatusCode != http.StatusOK {
          		t.Fatalf("login: %d", login.StatusCode)
          	}
          	cookie := login.Cookies()[0]
          	login.Body.Close()
          	created := call(http.MethodPost, "/api/lists", `{"name":"lab","kind":"L7","items":["example.com"],"authorized":true}`, cookie)
          	if created.StatusCode != http.StatusCreated {
          		t.Fatalf("liste: %d", created.StatusCode)
          	}
          	var list store.List
          	if err := json.NewDecoder(created.Body).Decode(&list); err != nil {
          		t.Fatal(err)
          	}
          	created.Body.Close()
          	probe := call(http.MethodPost, "/api/paths", `{"raw":"/.env","tags":"config"}`, cookie)
          	if probe.StatusCode != http.StatusCreated {
          		t.Fatalf("chemin: %d", probe.StatusCode)
          	}
          	var path store.Path
          	if err := json.NewDecoder(probe.Body).Decode(&path); err != nil {
          		t.Fatal(err)
          	}
          	probe.Body.Close()
          	crack, err := st.CreateCrack(ctx, user.ID, list.ID, path.ID, true)
          	if err != nil {
          		t.Fatal(err)
          	}
          	if err := st.SetCrackStatus(ctx, crack.ID, "completed", "{}"); err != nil {
          		t.Fatal(err)
          	}
          	purge := call(http.MethodDelete, "/api/scans", "", cookie)
          	if purge.StatusCode != http.StatusOK {
          		t.Fatalf("purge: %d", purge.StatusCode)
          	}
          	purge.Body.Close()
          	history := call(http.MethodGet, "/api/scans", "", cookie)
          	defer history.Body.Close()
          	var scans []store.Crack
          	if err := json.NewDecoder(history.Body).Decode(&scans); err != nil {
          		t.Fatal(err)
          	}
          	if len(scans) != 0 {
          		t.Fatalf("historique résiduel: %d", len(scans))
          	}
          	remove := call(http.MethodDelete, "/api/lists/1", "", cookie)
          	defer remove.Body.Close()
          	if remove.StatusCode != http.StatusOK {
          		t.Fatalf("suppression liste: %d", remove.StatusCode)
          	}
          }
          '''
          tests.write_text(body)
          print("patch appliqué")
          PY
      - name: format
        run: |
          gofmt -w internal/api/handlers_inventory.go internal/api/api_test.go
          test -z "$(gofmt -l .)"
      - name: frontend
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: vet
        run: go vet ./... 2>&1 | tee report-vet.txt
      - name: build
        run: go build ./... 2>&1 | tee report-build.txt
      - name: tests
        run: |
          set +e
          go test ./internal/store/... ./internal/api/... -timeout 180s -v > report-tests.txt 2>&1
          echo "code=$?" >> report-tests.txt
          sed -n '/TestClearScansEndpoint/,$p' internal/api/api_test.go > report-source.txt
          exit 0
      - name: publier
        if: always()
        run: |
          cat report-vet.txt report-build.txt report-tests.txt report-source.txt > report.txt 2>/dev/null
          git checkout -B m2b-diag
          git add -f report.txt
          git commit -m "m2b-diag: rapport"
          git push --force origin m2b-diag
