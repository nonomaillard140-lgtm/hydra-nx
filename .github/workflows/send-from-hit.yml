name: send-from-hit
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: migration et modele
        run: |
          cat > internal/store/migrations/0002_hit_secret.sql <<'GOEOF'
          ALTER TABLE hits ADD COLUMN secret_enc TEXT NOT NULL DEFAULT '';
          GOEOF
          python3 - <<'PYEOF'
          import pathlib, sys
          p = pathlib.Path("internal/store/models.go")
          s = p.read_text(encoding="utf-8")
          old = '\tSecretHash     string    `json:"-"`'
          if old not in s:
              sys.exit("ancre hit absente")
          s = s.replace(old, old + '\n\tSecretEnc      string    `json:"-"`', 1)
          old_send = '\tID        int64     `json:"id"`\n\tUserID    int64     `json:"user_id"`\n\tTransport string'
          if old_send not in s:
              sys.exit("ancre send absente")
          s = s.replace(old_send, '\tID        int64     `json:"id"`\n\tHitID     int64     `json:"hit_id"`\n\tUserID    int64     `json:"user_id"`\n\tTransport string', 1)
          p.write_text(s, encoding="utf-8")
          print("modele etendu")
          PYEOF
      - name: persistance
        run: |
          python3 - <<'PYEOF'
          import pathlib, sys
          p = pathlib.Path("internal/store/queries_hits.go")
          s = p.read_text(encoding="utf-8")
          pairs = [
            ('secret_redacted,secret_hash,status,points,cash_score,smtp_usable,first_seen,last_seen"',
             'secret_redacted,secret_hash,secret_enc,status,points,cash_score,smtp_usable,first_seen,last_seen"'),
            ('&h.SecretRedacted, &h.SecretHash, &h.Status', '&h.SecretRedacted, &h.SecretHash, &h.SecretEnc, &h.Status'),
            ('vuln=?,secret_redacted=?,status=?', 'vuln=?,secret_redacted=?,secret_enc=?,status=?'),
            ('hit.Vuln, hit.SecretRedacted, hit.Status,', 'hit.Vuln, hit.SecretRedacted, hit.SecretEnc, hit.Status,'),
            ('secret_redacted,secret_hash,status,points,cash_score,smtp_usable)\nVALUES(?,?,?,?,?,?,?,?,?,?,?,?)',
             'secret_redacted,secret_hash,secret_enc,status,points,cash_score,smtp_usable)\nVALUES(?,?,?,?,?,?,?,?,?,?,?,?,?)'),
            ('hit.SecretRedacted, hit.SecretHash, hit.Status, hit.Points', 'hit.SecretRedacted, hit.SecretHash, hit.SecretEnc, hit.Status, hit.Points'),
            ('VALUES(NULL,?,?,?,?,?,?,?)", send.UserID,', 'VALUES(NULLIF(?,0),?,?,?,?,?,?,?)", send.HitID, send.UserID,'),
            ('"SELECT id,user_id,transport', '"SELECT id,hit_id,user_id,transport'),
            ('&item.ID, &item.UserID,', '&item.ID, &item.HitID, &item.UserID,'),
          ]
          for old, new in pairs:
              if old not in s:
                  sys.exit("ancre absente: " + old[:40])
              s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          print("requetes mises a jour")
          PYEOF
      - name: chiffrement a l'ecriture
        run: |
          python3 - <<'PYEOF'
          import pathlib, sys
          p = pathlib.Path("internal/scan/scanner.go")
          s = p.read_text(encoding="utf-8")
          old = '\t\thit, err := s.store.UpsertHit(ctx, store.Hit{CrackID: crack.ID,'
          if old not in s:
              sys.exit("ancre upsert absente")
          s = s.replace(old, '\t\tsecretEnc, _ := s.store.Encrypt(finding.Value)\n' + old, 1)
          old2 = 'SecretHash: s.store.Fingerprint(finding.ValueHash),'
          if old2 not in s:
              sys.exit("ancre empreinte absente")
          s = s.replace(old2, old2 + ' SecretEnc: secretEnc,', 1)
          p.write_text(s, encoding="utf-8")
          print("scanner chiffre la valeur")
          PYEOF
      - name: transport derive
        run: |
          cat > internal/send/hit.go <<'GOEOF'
          package send

          import (
          	"context"
          	"errors"
          	"net/mail"
          	"strings"

          	"hydra/internal/store"
          )

          type SendRequest struct {
          	To       string `json:"to"`
          	Host     string `json:"host"`
          	Port     int    `json:"port"`
          	Username string `json:"username"`
          	From     string `json:"from"`
          	Subject  string `json:"subject"`
          	Body     string `json:"body"`
          }

          // DeriveTransport déduit l'hôte et l'utilisateur de la valeur trouvée, la surcharge manuelle gagne.
          func DeriveTransport(secret string, request SendRequest) (SMTPConfig, error) {
          	secret = strings.TrimSpace(secret)
          	if secret == "" {
          		return SMTPConfig{}, errors.New("valeur du secret absente: relancer le scan")
          	}
          	to := strings.TrimSpace(request.To)
          	if _, err := mail.ParseAddress(to); err != nil {
          		return SMTPConfig{}, errors.New("destinataire invalide")
          	}
          	subject := strings.TrimSpace(request.Subject)
          	if subject == "" || len(subject) > 200 {
          		return SMTPConfig{}, errors.New("sujet requis, 200 caractères maximum")
          	}
          	if strings.TrimSpace(request.Body) == "" || len(request.Body) > 100000 {
          		return SMTPConfig{}, errors.New("corps requis, 100000 octets maximum")
          	}
          	username := strings.TrimSpace(request.Username)
          	host := strings.TrimSpace(request.Host)
          	if username == "" {
          		if address, err := mail.ParseAddress(secret); err == nil {
          			username = address.Address
          		}
          	}
          	if host == "" {
          		if _, domain, found := strings.Cut(username, "@"); found && domain != "" {
          			host = "smtp." + domain
          		}
          	}
          	if host == "" {
          		return SMTPConfig{}, errors.New("hôte SMTP requis")
          	}
          	if strings.ContainsAny(host, "\r\n /") {
          		return SMTPConfig{}, errors.New("hôte SMTP invalide")
          	}
          	if username == "" {
          		return SMTPConfig{}, errors.New("utilisateur SMTP requis")
          	}
          	from := strings.TrimSpace(request.From)
          	if from == "" {
          		from = username
          	}
          	if _, err := mail.ParseAddress(from); err != nil {
          		return SMTPConfig{}, errors.New("expéditeur invalide")
          	}
          	port := request.Port
          	if port == 0 {
          		port = 587
          	}
          	if port < 1 || port > 65535 {
          		return SMTPConfig{}, errors.New("port SMTP invalide")
          	}
          	return SMTPConfig{Host: host, Port: port, Username: username, Password: secret, From: from, ControlAddress: to}, nil
          }

          // SendHit envoie depuis un hit SMTP utilisable, la valeur étant déchiffrée à la volée.
          func (m *Manager) SendHit(ctx context.Context, userID, hitID int64, request SendRequest) error {
          	hit, err := m.store.HitByID(ctx, hitID, userID)
          	if err != nil {
          		return err
          	}
          	if !hit.SMTPUsable || (hit.Service != "smtp" && hit.Service != "o365") {
          		return errors.New("ce hit n'est pas un identifiant SMTP utilisable")
          	}
          	if hit.SecretEnc == "" {
          		return errors.New("valeur en clair absente: relancer le scan")
          	}
          	secret, err := m.store.Decrypt(hit.SecretEnc)
          	if err != nil {
          		return err
          	}
          	config, err := DeriveTransport(secret, request)
          	if err != nil {
          		return err
          	}
          	record := store.Send{UserID: userID, HitID: hit.ID, Transport: "smtp", From: config.From, To: config.ControlAddress, Subject: strings.TrimSpace(request.Subject)}
          	if err := sendSMTP(ctx, config, record.Subject, request.Body); err != nil {
          		record.Status, record.Error = "failed", err.Error()
          		_ = m.store.RecordSend(ctx, record)
          		return err
          	}
          	record.Status = "sent"
          	return m.store.RecordSend(ctx, record)
          }
          GOEOF
      - name: test du transport
        run: |
          cat > internal/send/hit_test.go <<'GOEOF'
          package send_test

          import (
          	"testing"

          	"hydra/internal/send"
          )

          func TestDeriveTransportFromFoundIdentity(t *testing.T) {
          	config, err := send.DeriveTransport("bob@exemple.tld", send.SendRequest{To: "dest@exemple.tld", Subject: "test", Body: "corps"})
          	if err != nil {
          		t.Fatal(err)
          	}
          	if config.Host != "smtp.exemple.tld" || config.Username != "bob@exemple.tld" || config.From != "bob@exemple.tld" || config.Port != 587 {
          		t.Fatalf("derivation inattendue: %+v", config)
          	}
          }

          func TestDeriveTransportManualOverride(t *testing.T) {
          	request := send.SendRequest{To: "dest@exemple.tld", Subject: "test", Body: "corps", Host: "mail.exemple.tld", Port: 465, Username: "bot", From: "bot@exemple.tld"}
          	config, err := send.DeriveTransport("secret-123", request)
          	if err != nil {
          		t.Fatal(err)
          	}
          	if config.Host != "mail.exemple.tld" || config.Port != 465 || config.Username != "bot" || config.From != "bot@exemple.tld" {
          		t.Fatalf("surcharge ignoree: %+v", config)
          	}
          }

          func TestDeriveTransportNeedsIdentity(t *testing.T) {
          	if _, err := send.DeriveTransport("secret-123", send.SendRequest{To: "dest@exemple.tld", Subject: "test", Body: "corps"}); err == nil {
          		t.Fatal("hôte manquant accepté")
          	}
          }

          func TestDeriveTransportRejectsBadRecipient(t *testing.T) {
          	if _, err := send.DeriveTransport("bob@exemple.tld", send.SendRequest{To: "dest", Subject: "test", Body: "corps"}); err == nil {
          		t.Fatal("destinataire invalide accepté")
          	}
          }
          GOEOF
      - name: route et handler
        run: |
          python3 - <<'PYEOF'
          import pathlib, sys
          p = pathlib.Path("internal/api/router.go")
          s = p.read_text(encoding="utf-8")
          old = '\t\tprivate.Get("/api/hits/export.csv", s.handleHitsExport)'
          if old not in s:
              sys.exit("ancre route absente")
          s = s.replace(old, old + '\n\t\tprivate.Post("/api/hits/{id}/send", s.handleHitSend)', 1)
          p.write_text(s, encoding="utf-8")

          h = pathlib.Path("internal/api/handlers_send.go")
          t = h.read_text(encoding="utf-8")
          anchor = 'func (s *Server) handleSendHistory('
          if anchor not in t:
              sys.exit("ancre handler absente")
          added = '''func (s *Server) handleHitSend(w http.ResponseWriter, r *http.Request) {
          	id, err := pathID(r)
          	if err != nil {
          		writeError(w, http.StatusBadRequest, errInvalidID.Error())
          		return
          	}
          	var request send.SendRequest
          	if !decodeJSON(w, r, &request) {
          		return
          	}
          	user := currentUser(r.Context())
          	if err := s.sender.SendHit(r.Context(), user.ID, id, request); err != nil {
          		writeError(w, http.StatusBadGateway, cleanMessage(err))
          		return
          	}
          	_ = s.store.Audit(r.Context(), user.ID, "send.hit", strconv.FormatInt(id, 10), "{}")
          	writeJSON(w, http.StatusOK, map[string]string{"status": "message envoyé"})
          }

          '''
          t = t.replace(anchor, added + anchor, 1)
          t = t.replace('import (\n\t"net/http"', 'import (\n\t"net/http"\n\t"strconv"', 1)
          h.write_text(t, encoding="utf-8")
          print("route et handler en place")
          PYEOF
      - name: interface
        run: |
          python3 - <<'PYEOF'
          import pathlib, sys
          p = pathlib.Path("web/src/types.ts")
          s = p.read_text(encoding="utf-8")
          old = "points: number; cash_score: number; last_seen: string };"
          if old not in s:
              sys.exit("ancre type hit absente")
          s = s.replace(old, "points: number; cash_score: number; smtp_usable: boolean; last_seen: string };", 1)
          s = s.replace("export type SendItem = { id: number;", "export type SendItem = { id: number; hit_id: number;", 1)
          p.write_text(s, encoding="utf-8")

          h = pathlib.Path("web/src/Hits.tsx")
          t = h.read_text(encoding="utf-8")
          pairs = [
            ("import { Download, Search, ShieldCheck } from 'lucide-react';",
             "import { Download, Search, Send, ShieldCheck } from 'lucide-react';"),
            ("const [hits, setHits] = useState<Hit[]>([]);",
             "const [hits, setHits] = useState<Hit[]>([]); const [target, setTarget] = useState<Hit | null>(null); const [feedback, setFeedback] = useState(''); const [busy, setBusy] = useState(false);"),
            ("  return <section><PageTitle eyebrow=\"BIBLIOTHÈQUE\"",
             """  const send = async (event: React.FormEvent<HTMLFormElement>) => {
    event.preventDefault(); if (!target) return; const data = new FormData(event.currentTarget); setBusy(true);
    try {
      await api(`/api/hits/${target.id}/send`, { method: 'POST', body: JSON.stringify({ to: data.get('to'), host: data.get('host'), port: Number(data.get('port')), username: data.get('username'), from: data.get('from'), subject: data.get('subject'), body: data.get('body') }) });
      setFeedback('Message envoyé'); setTarget(null);
    } catch (reason) { setFeedback(reason instanceof Error ? reason.message : 'Envoi impossible'); } finally { setBusy(false); }
  };
  return <section><PageTitle eyebrow="BIBLIOTHÈQUE\""""),
            ("'Points', 'Priorité', 'Dernier passage']", "'Points', 'Priorité', 'Dernier passage', 'Envoi']"),
            ("<td>{date(hit.last_seen)}</td></tr>",
             "<td>{date(hit.last_seen)}</td><td>{hit.smtp_usable ? <button className=\"icon-button\" onClick={() => { setFeedback(''); setTarget(hit); }} aria-label=\"Envoyer depuis ce hit\"><Send size={16} /></button> : '—'}</td></tr>"),
            ("  </section>;\n}",
             """    {target && <form className="work-form" onSubmit={send}><h2><Send size={18} />Envoi depuis le hit {target.id}</h2>{feedback && <p className="scope-note">{feedback}</p>}<div className="form-grid two"><Field label="Destinataire"><input name="to" type="email" required /></Field><Field label="Expéditeur" hint="vide = identifiant trouvé"><input name="from" type="email" /></Field></div><div className="form-grid three"><Field label="Hôte SMTP" hint="vide = smtp.<domaine>"><input name="host" placeholder="smtp.exemple.tld" /></Field><Field label="Port"><input name="port" type="number" min="1" max="65535" defaultValue="587" /></Field><Field label="Utilisateur" hint="vide = identifiant trouvé"><input name="username" /></Field></div><Field label="Sujet"><input name="subject" required maxLength={200} defaultValue="Test HYDRA" /></Field><Field label="Corps"><textarea name="body" required rows={5} defaultValue="Message envoyé depuis un identifiant SMTP découvert." /></Field><div className="button-row"><button className="primary" disabled={busy}><Send size={16} />Envoyer</button><button type="button" className="secondary" onClick={() => setTarget(null)}>Fermer</button></div></form>}
  </section>;
}"""),
          ]
          for old, new in pairs:
              if old not in t:
                  sys.exit("ancre interface absente: " + old[:40])
              t = t.replace(old, new, 1)
          h.write_text(t, encoding="utf-8")
          print("interface branchee")
          PYEOF
      - name: controles
        run: |
          gofmt -w internal/
          grep -q 'secret_enc' internal/store/queries_hits.go
          grep -q 'SendHit' internal/api/handlers_send.go
          grep -q 'handleHitSend' internal/api/router.go
          grep -q 'smtp_usable' web/src/types.ts
      - name: frontend
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: suite complete avant push
        run: |
          go vet ./...
          go build ./...
          go test ./... -count=1
      - name: commit et push
        run: |
          git config user.name "hydra-bot"
          git config user.email "hydra-bot@users.noreply.github.com"
          git add -A
          git commit -m "envoi SMTP depuis un hit, valeur chiffree et tracabilite"
          git push origin HEAD:main
