name: settings-toggle
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  toggle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: exposition du reglage
        run: |
          python3 - <<'PYEOF'
          import pathlib, sys

          h = pathlib.Path("internal/api/handlers_admin.go")
          s = h.read_text(encoding="utf-8")
          old = 'allowed := map[string]bool{"concurrency": true,'
          if old not in s:
              sys.exit("ancre liste blanche absente")
          s = s.replace(old, 'allowed := map[string]bool{"variants_extended": true, "concurrency": true,', 1)
          h.write_text(s, encoding="utf-8")
          print("liste blanche backend etendue")

          a = pathlib.Path("web/src/Admin.tsx")
          t = a.read_text(encoding="utf-8")
          old_keys = "['public_hits', 'Hits publics'], ['grace_hours', 'Grâce heures']"
          if old_keys not in t:
              sys.exit("ancre formulaire absente")
          t = t.replace(old_keys, "['public_hits', 'Hits publics'], ['grace_hours', 'Grâce heures']", 1)
          old_save = "['concurrency', 'timeout_seconds', 'host_limit', 'maintenance', 'public_hits', 'grace_hours'].map"
          if old_save not in t:
              sys.exit("ancre sauvegarde absente")
          t = t.replace(old_save, "['concurrency', 'timeout_seconds', 'host_limit', 'maintenance', 'public_hits', 'grace_hours', 'variants_extended'].map", 1)
          old_btn = '</div><button className="primary" disabled={busy}><Save size={16} />Enregistrer les réglages</button></form>'
          if old_btn not in t:
              sys.exit("ancre bouton absente")
          select = ('</div><Field label="Variantes encodées" hint="true = formes encodées des chemins sensibles">'
                    '<select name="variants_extended" defaultValue={settings[\'variants_extended\'] || \'false\'}>'
                    '<option value="false">désactivées</option><option value="true">activées</option>'
                    '</select></Field><button className="primary" disabled={busy}><Save size={16} />Enregistrer les réglages</button></form>')
          t = t.replace(old_btn, select, 1)
          a.write_text(t, encoding="utf-8")
          print("selecteur ajoute")
          PYEOF
          grep -q '"variants_extended": true' internal/api/handlers_admin.go
          grep -q 'variants_extended' web/src/Admin.tsx
      - name: frontend
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: suite complete avant push
        run: |
          gofmt -l internal/ | tee /tmp/fmt.txt
          test ! -s /tmp/fmt.txt
          go vet ./...
          go build ./...
          go test ./... -count=1
      - name: commit et push
        run: |
          git config user.name "hydra-bot"
          git config user.email "hydra-bot@users.noreply.github.com"
          git add -A
          git commit -m "reglage variants_extended exposé à l'admin"
          git push origin HEAD:main
