services:
  hydra:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      HYDRA_SECURE_COOKIE: "false"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - hydra-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
volumes:
  hydra-data:
