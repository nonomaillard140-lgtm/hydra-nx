name: m1-d-smtp-erreurs
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  m1d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: erreur typee conservee
        run: |
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path("internal/send/smtp.go")
          s = p.read_text(encoding="utf-8")
          if "var lastErr error" in s:
              print("conservation deja en place")
          else:
              old = '\tvar errorsSeen []string\n\tfor _, port := range ports {\n\t\tdialCtx, cancel := context.WithTimeout(ctx, 15*time.Second)\n\t\terr := sendOnPort(dialCtx, config, port, subject, body)\n\t\tcancel()\n\t\tif err == nil {\n\t\t\treturn nil\n\t\t}\n\t\terrorsSeen = append(errorsSeen, strconv.Itoa(port)+": "+err.Error())\n\t}\n\treturn fmt.Errorf("envoi SMTP impossible (%s)", strings.Join(errorsSeen, "; "))'
              assert old in s, "ancre sendSMTP absente"
              new = '\tvar errorsSeen []string\n\tvar lastErr error\n\tfor _, port := range ports {\n\t\tdialCtx, cancel := context.WithTimeout(ctx, 15*time.Second)\n\t\terr := sendOnPort(dialCtx, config, port, subject, body)\n\t\tcancel()\n\t\tif err == nil {\n\t\t\treturn nil\n\t\t}\n\t\tlastErr = err\n\t\terrorsSeen = append(errorsSeen, strconv.Itoa(port)+": "+err.Error())\n\t}\n\tif lastErr == nil {\n\t\tlastErr = errors.New("envoi SMTP impossible")\n\t}\n\treturn fmt.Errorf("envoi SMTP impossible (%s): %w", strings.Join(errorsSeen, "; "), lastErr)'
              s = s.replace(old, new, 1)
              p.write_text(s, encoding="utf-8")
              print("erreur typee conservee")
          PYEOF
      - name: destinataire distingue du relais
        run: |
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path("internal/send/mx.go")
          s = p.read_text(encoding="utf-8")
          if "destinataire_refuse" in s:
              print("distinction deja en place")
          else:
              old = '\tif errors.As(err, &protocolErr) {\n\t\tswitch protocolErr.Code {'
              assert old in s, "ancre classification absente"
              new = '\tif errors.As(err, &protocolErr) {\n\t\tif protocolErr.Code == 550 && strings.Contains(protocolErr.Msg, "5.1.1") {\n\t\t\treturn &SMTPError{Code: "destinataire_refuse", Field: "to", Kind: "configuration", Message: "destinataire inconnu du serveur", Cause: err}\n\t\t}\n\t\tswitch protocolErr.Code {'
              s = s.replace(old, new, 1)
              old_low = '\tlower := strings.ToLower(err.Error())\n'
              assert old_low in s, "ancre texte absente"
              new_low = '\tlower := strings.ToLower(err.Error())\n\tif strings.Contains(lower, "5.1.1") {\n\t\treturn &SMTPError{Code: "destinataire_refuse", Field: "to", Kind: "configuration", Message: "destinataire inconnu du serveur", Cause: err}\n\t}\n'
              s = s.replace(old_low, new_low, 1)
              p.write_text(s, encoding="utf-8")
              print("destinataire distingue du relais")
          PYEOF
      - name: tests ajoutes
        run: |
          if grep -q TestClassifyDestinataireInconnu internal/send/mx_test.go; then
            echo "tests deja ajoutes"
          else
            cat >> internal/send/mx_test.go <<'GOEOF'

          func TestClassifyDestinataireInconnu(t *testing.T) {
          	classified := send.ClassifySMTPError(&textproto.Error{Code: 550, Msg: "5.1.1 The email account that you tried to reach does not exist"})
          	if classified == nil || classified.Code != "destinataire_refuse" || classified.Field != "to" {
          		t.Fatalf("classification inattendue: %+v", classified)
          	}
          }

          func TestClassifyConserveLeTypeApresReemballage(t *testing.T) {
          	inner := &textproto.Error{Code: 535, Msg: "auth"}
          	wrapped := fmt.Errorf("envoi SMTP impossible (587: %s): %w", inner.Error(), inner)
          	classified := send.ClassifySMTPError(wrapped)
          	if classified == nil || classified.Code != "auth_refusee" {
          		t.Fatalf("type perdu au reemballage: %+v", classified)
          	}
          }
          GOEOF
          fi
      - name: import fmt dans les tests
        run: |
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path("internal/send/mx_test.go")
          s = p.read_text(encoding="utf-8")
          if '\t"fmt"\n' in s:
              print("import deja present")
          else:
              old = '\t"errors"\n'
              assert old in s, "ancre import absente"
              s = s.replace(old, old + '\t"fmt"\n', 1)
              p.write_text(s, encoding="utf-8")
              print("import fmt ajoute")
          PYEOF
      - name: frontend
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: controles
        run: |
          gofmt -w internal/
          grep -q 'var lastErr error' internal/send/smtp.go
          grep -q '%w' internal/send/smtp.go
          grep -q 'destinataire_refuse' internal/send/mx.go
      - name: suite complete avant push
        run: |
          go vet ./...
          go build ./...
          go test ./... -count=1
      - name: commit et push
        run: |
          git config user.name "hydra-bot"
          git config user.email "hydra-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "rien a committer"; else git commit -m "smtp: erreur typee conservee, destinataire inconnu distingue du relais"; fi
          git push origin HEAD:main
